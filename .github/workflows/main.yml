name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Find project and setup
        run: |
          if [ -f "question_scanner_app/pubspec.yaml" ]; then
            echo "PROJECT_DIR=question_scanner_app" >> $GITHUB_ENV
          elif [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            find . -name "pubspec.yaml" -maxdepth 3 | head -1
            DIR=$(find . -name "pubspec.yaml" -maxdepth 3 | head -1 | xargs dirname)
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Download Fonts
        run: |
          mkdir -p $PROJECT_DIR/assets/fonts $PROJECT_DIR/assets/tessdata
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Regular.ttf" -o $PROJECT_DIR/assets/fonts/NotoSansBengali-Regular.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Bold.ttf" -o $PROJECT_DIR/assets/fonts/NotoSansBengali-Bold.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -o $PROJECT_DIR/assets/fonts/NotoSans-Regular.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -o $PROJECT_DIR/assets/fonts/NotoSans-Bold.ttf

      - name: Flutter pub get
        run: cd $PROJECT_DIR && flutter pub get

      - name: Build APK
        run: cd $PROJECT_DIR && flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Question-Scanner-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
