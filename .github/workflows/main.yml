name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: question_scanner_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Download Fonts
        run: |
          mkdir -p assets/fonts assets/tessdata
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Regular.ttf" -o assets/fonts/NotoSansBengali-Regular.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Bold.ttf" -o assets/fonts/NotoSansBengali-Bold.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -o assets/fonts/NotoSans-Regular.ttf
          curl -L "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -o assets/fonts/NotoSans-Bold.ttf
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: Question-Scanner-APK
          path: question_scanner_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
