name: question_scanner
description: Offline Question Paper Scanner & Printable PDF Generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OCR - Google ML Kit (works offline on Android)
  google_mlkit_text_recognition: ^0.13.0

  # File picking
  file_picker: ^8.0.7

  # PDF generation
  pdf: ^3.10.8
  printing: ^5.13.0

  # PDF reading
  syncfusion_flutter_pdf: ^26.1.39

  # Storage & permissions
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1

  # Image processing
  image: ^4.2.0

  # DOCX parsing
  archive: ^3.6.1
  xml: ^6.5.0

  # State management
  provider: ^6.1.2

  # Database
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1

  # UI
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8
  open_file: ^3.5.8
  intl: ^0.19.0
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/tessdata/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
